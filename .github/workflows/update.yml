# Create branches with automatic 0watch updates
name: Update
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'

jobs:
  watch:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            run: feeds\watch.ps1
          - os: macos-latest
            name: macos
            run: feeds/watch.sh
          - os: ubuntu-latest
            name: linux
            run: |
              sudo apt-get -qq install python3-gnupg
              feeds/watch.sh
    runs-on: ${{matrix.os}}
    steps:
      - uses: 0install/github-actions/0repo-setup@v1
        with:
          git-user-name: apps.0install.net
          git-user-email: webmaster@0install.net
      - name: Run 0watch
        env:
          GITHUB_TOKEN: ${{github.token}}
        run: ${{matrix.run}}
      - name: Upload generated feeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.name}}-feeds
          path: incoming

  merge:
    runs-on: ubuntu-latest
    needs: [watch]
    steps:
      - uses: 0install/github-actions/0repo-setup@v1
        with:
          git-user-name: apps.0install.net
          git-user-email: webmaster@0install.net
      - name: Download feeds
        uses: actions/download-artifact@v4
        with:
          pattern: '*-feeds'
          merge-multiple: true
          path: incoming
      - name: Check if there are new feeds
        id: new-feeds
        run: if ls incoming/*.xml; then echo "found=true" >> $GITHUB_OUTPUT; fi
      - uses: 0install/github-actions/0repo@v1
        if: steps.new-feeds.outputs.found
      - name: Create Pull Request
        if: steps.new-feeds.outputs.found
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{github.token}}
          path: feeds
          branch: automatic-updates
          title: Automatic updates
          body: Automatic updates generated by 0watch scripts
