# Create branches with automatic 0watch updates
name: Update
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: 0install/github-actions/0repo-setup@v1
        with:
          git-user-name: apps.0install.net
          git-user-email: webmaster@0install.net
      - name: Run 0watch
        env:
          GITHUB_TOKEN: ${{github.token}}
        run: feeds\watch.ps1
      - name: Upload generated feeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-feeds
          path: incoming

  macos:
    runs-on: macos-latest
    steps:
      - uses: 0install/github-actions/0repo-setup@v1
        with:
          git-user-name: apps.0install.net
          git-user-email: webmaster@0install.net
      - name: Run 0watch
        env:
          GITHUB_TOKEN: ${{github.token}}
        run: feeds/watch.sh
      - name: Upload generated feeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-feeds
          path: incoming

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: 0install/github-actions/0repo-setup@v1
        with:
          git-user-name: apps.0install.net
          git-user-email: webmaster@0install.net
      - name: Run 0watch
        env:
          GITHUB_TOKEN: ${{github.token}}
        run: |
          sudo apt-get -qq install python3-gnupg
          feeds/watch.sh
      - name: Upload generated feeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-feeds
          path: incoming

  merge:
    runs-on: ubuntu-latest
    needs: [windows, macos, linux]
    steps:
      - uses: 0install/github-actions/0repo-setup@v1
        with:
          git-user-name: apps.0install.net
          git-user-email: webmaster@0install.net
      - name: Download feeds generated on Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-feeds
          path: incoming
      - name: Download feeds generated on MacOS
        uses: actions/download-artifact@v4
        with:
          name: macos-feeds
          path: incoming
      - name: Download feeds generated on Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-feeds
          path: incoming
      - name: Check if there are new feeds
        id: new-feeds
        run: if ls incoming/*.xml; then echo "found=true" >> $GITHUB_OUTPUT; fi
      - uses: 0install/github-actions/0repo@v1
        if: steps.new-feeds.outputs.found
      - name: Create Pull Request
        if: steps.new-feeds.outputs.found
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{github.token}}
          path: feeds
          branch: automatic-updates
          title: Automatic updates
          body: Automatic updates generated by 0watch scripts
